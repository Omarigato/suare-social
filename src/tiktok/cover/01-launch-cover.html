<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, user-scalable=no">
  <link rel="stylesheet" href="../../../shared/styles.css">
  <title>SUARE — TikTok Launch</title>
</head>
<body>
  <div class="canvas tall">
    <div class="bg-photo"><img src="https://images.unsplash.com/photo-1532712938310-34cb3982ef74?auto=format&fit=crop&w=1400&q=80" alt=""></div>
       <div class="photo-overlay"></div>
    <div class="grain"></div>
    <div class="scan-line"></div>
    <div class="header-bar">
    <div class="logo-wrap">
      <img src="../../../shared/logo-light.svg" alt="SUARE">
    </div>
    
  </div>

    <div class="slide-body" style="top:220px; bottom:180px;">
      <div class="section-marker" style="font-size:24px; padding:10px 24px;">НОВАЯ ЭРА ТОЕВ В КАЗАХСТАНЕ</div>
      <div class="notch-gold" style="width:130px; height:130px; display:flex; align-items:center; justify-content:center; margin-bottom:40px;">
        <svg width="68" height="68" viewBox="0 0 24 24" fill="none" stroke="hsl(var(--primary))" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" /><path d="M5 3v4" /><path d="M19 17v4" /><path d="M3 5h4" /><path d="M17 19h4" /></svg>
      </div>
      <h1 class="slide-headline font-display" style="font-size:88px;">
        <span style="display:block; white-space:nowrap;">ЗАБУДЬТЕ</span>
        <span class="text-stroke" style="display:block; white-space:nowrap;">ПРО БУМАЖНЫЕ</span>
        <span class="text-gold" style="display:block; white-space:nowrap;">ШАҚЫРУ.</span>
      </h1>
      <p class="slide-desc" style="font-size:32px; max-width:920px;">Как сделать стильное пригласительное на свадьбу или қыз ұзату за 5 минут прямо со смартфона.</p>
      <div class="slide-chips" style="margin-top:40px;">
        <span class="slide-chip gold" style="font-size:20px; padding:14px 26px;">СВАДЬБА</span>
        <span class="slide-chip gold" style="font-size:20px; padding:14px 26px;">ҚЫЗ ҰЗАТУ</span>
        <span class="slide-chip gold" style="font-size:20px; padding:14px 26px;">RSVP В 1 КЛИК</span>
      </div>
    </div>

    <div class="footer-bar">
    <div class="handle"><b>@suare.app</b> · TikTok & Reels</div>
    <div class="footer-badge">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
      <span>suare.app</span>
    </div>
  </div>
  </div>
</body>
</html>
