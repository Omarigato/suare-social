<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, user-scalable=no">
  <link rel="stylesheet" href="../../../shared/styles.css">
  <title>SUARE — Бумага против Онлайн</title>
</head>
<body>
  <div class="canvas tall">
    <div class="bg-photo"><img src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1400&q=80" alt=""></div>
       <div class="photo-overlay"></div>
    <div class="grain"></div>
    <div class="scan-line"></div>
    <div class="header-bar">
    <div class="logo-wrap">
      <img src="../../../shared/logo-light.svg" alt="SUARE">
    </div>
    
  </div>

    <div class="slide-body" style="top:220px; bottom:180px;">
      <div class="section-marker" style="font-size:24px; padding:10px 24px;">ЭКОНОМИЯ НА СВАДЬБЕ</div>
      <div class="notch-gold" style="width:130px; height:130px; display:flex; align-items:center; justify-content:center; margin-bottom:40px;">
        <svg width="68" height="68" viewBox="0 0 24 24" fill="none" stroke="hsl(var(--primary))" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18" /><path d="M18 17V9" /><path d="M13 17V5" /><path d="M8 17v-3" /></svg>
      </div>
      <h1 class="slide-headline font-display" style="font-size:78px;">
        <span style="display:block; white-space:nowrap;">ПОЧЕМУ ТЫ</span>
        <span class="text-stroke" style="display:block; white-space:nowrap;">ТЕРЯЕШЬ ДЕНЬГИ</span>
        <span class="text-gold" style="display:block; white-space:nowrap;">НА БУМАГЕ?</span>
      </h1>
      <p class="slide-desc" style="font-size:32px; max-width:920px;">Посчитай: пустые места в банкетном зале стоят дороже свадьбы. Как собрать точный список гостей.</p>
      <div class="slide-chips" style="margin-top:40px;">
        <span class="slide-chip gold" style="font-size:20px; padding:14px 26px;">ЛАЙФХАК ДЛЯ ТОЯ</span>
        <span class="slide-chip gold" style="font-size:20px; padding:14px 26px;">ТОЧНЫЙ СПИСОК</span>
      </div>
    </div>

    <div class="footer-bar">
    <div class="handle"><b>@suare.app</b> · TikTok & Reels</div>
    <div class="footer-badge">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
      <span>suare.app</span>
    </div>
  </div>
  </div>
</body>
</html>
