<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, user-scalable=no">
  <link rel="stylesheet" href="../../../shared/styles.css">
  <title>SUARE — Обучающий курс по онлайн-шақыру</title>
</head>
<body>
  <div class="canvas wide">
    <div class="bg-photo"><img src="https://images.unsplash.com/photo-1532712938310-34cb3982ef74?auto=format&fit=crop&w=1400&q=80" alt=""></div>
       <div class="photo-overlay"></div>
    
    <div class="grain"></div>
    <div class="scan-line"></div>

    <div class="header-bar" style="top:50px; left:90px; right:90px;">
      <div class="logo-wrap">
        <img src="../../../shared/logo-light.svg" alt="SUARE" style="height:54px;">
      </div>
      <div class="slide-index">ПЛЕЙЛИСТ · <b>20 ВИДЕО</b></div>
    </div>

    <div class="yt-icon"><svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="hsl(var(--primary))" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" /><path d="M5 3v4" /><path d="M19 17v4" /><path d="M3 5h4" /><path d="M17 19h4" /></svg></div>

    <div class="yt-body">
      <div class="section-marker">ОБУЧАЮЩИЙ КУРС ПО SUARE</div>
      <h1 class="font-display" style="font-size:84px;">
        <span style="display:block; white-space:nowrap;">ПОЛНЫЙ КУРС.</span>
        <span class="text-stroke" style="display:block; white-space:nowrap;">ОНЛАЙН-ШАҚЫРУ</span>
        <span class="text-gold" style="display:block; white-space:nowrap;">ОТ А ДО Я.</span>
      </h1>
      <p class="yt-sub">20 пошаговых видеоуроков: от создания первого пригласительного до идеального списка гостей и экономии бюджета тоя.</p>
      <div class="yt-chips">
        <span class="yt-chip">20 УРОКОВ</span>
        <span class="yt-chip">SUARE.APP</span>
        <span class="yt-chip">БЕСПЛАТНО</span>
      </div>
    </div>

    <div class="yt-foot">
      <span><b>suare.app</b></span>
      <span class="sep">·</span>
      <span>@suare.app</span>
      <span class="sep">·</span>
      <span>Онлайн-шақыру жасау</span>
    </div>
  </div>
