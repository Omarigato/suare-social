<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, user-scalable=no">
  <link rel="stylesheet" href="../../../../shared/styles.css">
  <title>SUARE — 01 / ОНЛАЙН-RSVP</title>
</head>
<body>
  <div class="canvas">
    
    <div class="grain"></div>
    <div class="scan-line"></div>
    <div class="header-bar">
    <div class="logo-wrap">
      <img src="../../../../shared/logo-light.svg" alt="SUARE">
    </div>
    <div class="slide-index"><b>02</b> / 08</div>
  </div>

    <div class="slide-body">
      <div class="section-marker">01 / ОНЛАЙН-RSVP</div>
      <div class="notch-gold" style="width:120px; height:120px; display:flex; align-items:center; justify-content:center; color:hsl(var(--primary)); margin-bottom:38px;">
        <svg width="62" height="62" viewBox="0 0 24 24" fill="none" stroke="hsl(var(--primary))" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></svg>
      </div>
      <h1 class="slide-headline font-display" style="font-size:82px;">
        <span style="display:block; white-space:nowrap;">ТОЧНЫЙ СПИСОК</span>
        <span class="text-stroke" style="display:block; white-space:nowrap;">БЕЗ ОБЗВОНА.</span>
      </h1>
      <p class="slide-desc">Гости подтверждают حضور в один клик: указывают, придут ли одни или с парой/детьми. Вы видите точное количество персон для банкетного зала.</p>
      <div class="slide-chips">
        <span class="slide-chip gold">ДЕТИ И ВЗРОСЛЫЕ</span>
        <span class="slide-chip ">БЕЗ ЛИШНИХ ТРАТ ЗА СТОЛ</span>
      </div>
      
      
    </div>

    <div class="footer-bar">
    <div class="handle"><b>@suare.app</b> · suare.app</div>
    <div class="footer-badge">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
      <span>Слайд 02 / 08</span>
    </div>
  </div>
  </div>
</body>
</html>
