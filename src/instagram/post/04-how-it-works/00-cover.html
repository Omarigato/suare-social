<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, user-scalable=no">
  <link rel="stylesheet" href="../../../../shared/styles.css">
  <title>SUARE — ПОШАГОВЫЙ ГАЙД</title>
</head>
<body>
  <div class="canvas">
    <div class="bg-photo"><img src="https://images.unsplash.com/photo-1520854221256-17451cc331bf?auto=format&fit=crop&w=1400&q=80" alt=""></div>
       <div class="photo-overlay"></div>
    <div class="grain"></div>
    <div class="scan-line"></div>
    <div class="header-bar">
    <div class="logo-wrap">
      <img src="../../../../shared/logo-light.svg" alt="SUARE">
    </div>
    <div class="slide-index"><b>01</b> / 05</div>
  </div>

    <div class="slide-body">
      <div class="section-marker">ПОШАГОВЫЙ ГАЙД</div>
      
      <h1 class="slide-headline font-display" style="font-size:74px;">
        <span style="display:block; white-space:nowrap;">КАК СОЗДАТЬ</span>
        <span class="text-stroke" style="display:block; white-space:nowrap;">ПРИГЛАСИТЕЛЬНОЕ</span>
        <span class="text-gold" style="display:block; white-space:nowrap;">ЗА 5 МИНУТ.</span>
      </h1>
      <p class="slide-desc">Никаких дизайнеров и ожидания типографии. Создайте идеальное цифровое приглашение с телефона прямо сейчас.</p>
      <div class="slide-chips">
        <span class="slide-chip gold">ПРОСТОЙ КОНСТРУКТОР</span>
        <span class="slide-chip ">БЕЗ ОПЫТА В ДИЗАЙНЕ</span>
      </div>
      
      
    </div>

    <div class="footer-bar">
    <div class="handle"><b>@suare.app</b> · suare.app</div>
    <div class="footer-badge">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
      <span>Шаг 00 / 04</span>
    </div>
  </div>
  </div>
</body>
</html>
