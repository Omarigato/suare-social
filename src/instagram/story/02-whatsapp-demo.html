<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, user-scalable=no">
  <link rel="stylesheet" href="../../../shared/styles.css">
  <title>SUARE — WhatsApp рассылка</title>
</head>
<body>
  <div class="canvas tall">
    <div class="bg-photo"><img src="https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?auto=format&fit=crop&w=1400&q=80" alt=""></div>
       <div class="photo-overlay"></div>
    <div class="grain"></div>
    <div class="scan-line"></div>
    <div class="header-bar">
    <div class="logo-wrap">
      <img src="../../../shared/logo-light.svg" alt="SUARE">
    </div>
    
  </div>

    <div class="slide-body" style="top:220px; bottom:180px;">
      <div class="section-marker" style="font-size:24px; padding:10px 24px;">УДОБНО ДЛЯ РОДНЫХ</div>
      <div class="notch-gold" style="width:130px; height:130px; display:flex; align-items:center; justify-content:center; margin-bottom:40px;">
        <svg width="68" height="68" viewBox="0 0 24 24" fill="none" stroke="hsl(var(--primary))" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21" /><path d="M9 10a.5.5 0 0 0 1 0V9a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1" /></svg>
      </div>
      <h1 class="slide-headline font-display" style="font-size:84px;">
        <span style="display:block; white-space:nowrap;">РАССЫЛКА В</span>
        <span class="text-stroke" style="display:block; white-space:nowrap;">WHATSAPP</span>
        <span class="text-gold" style="display:block; white-space:nowrap;">ПО ИМЕНАМ.</span>
      </h1>
      <p class="slide-desc" style="font-size:32px; max-width:920px;">Каждый гость получает персональную ссылку с красивым превью в чат.</p>
      <div class="slide-chips" style="margin-top:40px;">
        <span class="slide-chip gold" style="font-size:20px; padding:14px 26px;">WHATSAPP</span>
        <span class="slide-chip gold" style="font-size:20px; padding:14px 26px;">ИМЕННЫЕ ШАҚЫРУ</span>
      </div>
    </div>

    <div class="footer-bar">
    <div class="handle"><b>@suare.app</b> · TikTok & Reels</div>
    <div class="footer-badge">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
      <span>suare.app</span>
    </div>
  </div>
  </div>
</body>
</html>
